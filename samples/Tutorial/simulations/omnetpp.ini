[General]
network = FogNetwork
sim-time-limit = 130s

*.numIoT = 15
*.numFog = 5

# Reproducibility
seed-set = 0

# --- Fog server load/utilization broadcast interval ---
*.fog[*].statusInterval = 0.1s

# --- IoT local execution model: Raspberry Pi 4B (hospital/edge domain) ---
#   BCM2711, quad Cortex-A72 @ 1.5 GHz; peak FP32 ~12 GFLOP/s, derated to an
#   effective sustained-available 600 MFLOP/s under OS/sensing load + battery.
*.iot[*].localThroughput = 600      # MFLOP/s (Pi 4B effective sustained)
*.iot[*].localPower = 5.0           # W (Pi 4B active CPU)
*.iot[*].txPower = 1.5              # 5G uplink transmit power (W)
*.iot[*].uplinkRate = 100e6         # 5G uplink data rate (bps)
*.iot[*].linkDelay = 0.005s         # fallback (actual delay read from channel)
*.iot[*].qpuTheta = 0.7             # quantum-suitability threshold (local-feasibility)

# --- Heterogeneous fog servers (teacher feedback) ---
#   fog[0] = QPU  (IBM,        superconducting)
#   fog[1] = QPU  (IonQ,       trapped ion)
#   fog[2] = GPU  (RTX 3090)
#   fog[3] = GPU  (RTX 3090)
#   fog[4] = CPU  (11-core)
*.fog[0].processorType = 2
*.fog[0].procName = "IBM"
*.fog[0].throughput = 200000        # MFLOP/s effective (P_QPU_max)
*.fog[0].power = 15000              # W (cryogenics)
*.fog[0].qpuOverhead = 0.0015s

*.fog[1].processorType = 2
*.fog[1].procName = "IonQ"
*.fog[1].throughput = 200000
*.fog[1].power = 12000
*.fog[1].qpuOverhead = 0.0020s      # trapped-ion gates are slower

*.fog[2].processorType = 1
*.fog[2].procName = "RTX3090"
*.fog[2].throughput = 35000         # MFLOP/s
*.fog[2].power = 350                # W
*.fog[2].efficiency = 0.55
*.fog[2].gpuBandwidth = 936e6       # bytes/s
*.fog[2].gpuLaunchOverhead = 0.0001s

*.fog[3].processorType = 1
*.fog[3].procName = "RTX3090b"
*.fog[3].throughput = 35000
*.fog[3].power = 350
*.fog[3].efficiency = 0.55
*.fog[3].gpuBandwidth = 936e6
*.fog[3].gpuLaunchOverhead = 0.0001s

*.fog[4].processorType = 0
*.fog[4].procName = "CPU-11core"
*.fog[4].throughput = 1000          # MFLOP/s
*.fog[4].power = 65                 # W

# Quantum-suitability threshold (tasks with Qs < theta are penalized on a QPU)
*.fog[*].qpuTheta = 0.7

# Default policy for the [General] run is round-robin
*.iot[*].decisionMode = "roundRobin"

# =====================================================================
# Offloading policy configurations (spec Section 8)
# Run each with:  ../src/Tutorial -u Cmdenv -c <ConfigName>
# =====================================================================

[Config Local]
description = "Baseline: always process locally"
*.iot[*].decisionMode = "local"

[Config Random]
description = "Baseline: random choice among local + 5 fog servers"
*.iot[*].decisionMode = "random"

[Config RoundRobin]
description = "Baseline: always offload, cycle through fog servers (no intelligence)"
*.iot[*].decisionMode = "roundRobin"

[Config Greedy]
description = "Intelligent: min completion time (network + queue + exec)"
*.iot[*].decisionMode = "greedy"

[Config DQN]
description = "RL: trained DQN policy for offloading decisions"
*.iot[*].decisionMode = "dqn"
*.iot[*].modelDir = "dqn_weights"
